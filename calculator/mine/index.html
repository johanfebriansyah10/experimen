<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<title>Johan Calucator</title>
	</head>
	<body>
		<div class="calculator">
			<input type="text" readonly id="display" value="0" />
			<div class="buttons">
				<button class="utility" data-action="clear">AC</button>
				<button class="utility" data-action="delete">DEL</button>
				<button class="utility" data-action="persent">%</button>
				<button class="operator" data-operator="/">÷</button>

				<button data-number="7">7</button>
				<button data-number="7">8</button>
				<button data-number="7">9</button>
				<button class="operator" data-operator="*">x</button>

				<button data-number="4">4</button>
				<button data-number="5">5</button>
				<button data-number="6">6</button>
				<button class="operator" data-operator="-">-</button>

				<button data-number="1">1</button>
				<button data-number="2">2</button>
				<button data-number="3">3</button>
				<button class="operator" data-operator="+">+</button>

				<button data-action="sign">±</button>
				<button data-number="0">0</button>
				<button data-action="decimal">.</button>
				<button class="equals" data-operator="=">=</button>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
