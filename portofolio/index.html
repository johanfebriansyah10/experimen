<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!--=============== FAVICON ===============-->
		<link
			rel="shortcut icon"
			href="assets/img/favicon.png"
			type="image/x-icon"
		/>

		<!--=============== REMIXICONS ===============-->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
		/>

		<!--=============== SWIPER CSS ===============-->
		<link rel="stylesheet" href="assets/css/swiper-bundle.min.css" />

		<!--=============== CSS ===============-->
		<link rel="stylesheet" href="assets/css/styles.css" />

		<title>Responsive portfolio website Anid - Bedimcode</title>
	</head>
	<body>
		<!--==================== HEADER ====================-->
		<header class="header" id="header">
			<div class="blob-animate"></div>
			<nav class="nav container">
				<a href="" class="nav-logo">Johan</a>

				<div class="nav-menu">
					<ul class="nav-list">
						<li>
							<a href="#home" class="nav-link">Home</a>
						</li>
						<li>
							<a href="#about" class="nav-link">About me</a>
						</li>
						<li>
							<a href="#projects" class="nav-link">projects</a>
						</li>
						<li>
							<a href="#contact" class="nav-link">Contact</a>
						</li>
					</ul>
				</div>
			</nav>
		</header>

		<!--==================== MAIN ====================-->
		<main class="main">
			<!-- CUSTOM CURSOR -->

			<!--==================== HOME ====================-->
			<section class="home section">
				<div class="home-shadow"></div>
				<div class="home-container container grid">
					<div class="home-data">
						<h3 class="home-greeting">Hello, I'm</h3>
						<h1 class="home-name">
							Johan <br />
							Febriansyah
						</h1>
					</div>

					<div class="home-image">
						<div class="blob-animate"></div>
						<img
							src="assets/img/home-perfil.png"
							alt="profile image"
							class="home-perfil"
							title="profile"
						/>
					</div>

					<div class="home-info">
						<h3 class="home-split">Creative</h3>
						<!-- insert profesion -->
						<h2 class="home-profesion-1">Developer</h2>
						<h2 class="home-profesion-2">& Designer</h2>
					</div>

					<div class="home-social">
						<a href="" target="_blank" class="social-home-link">
							<i class="ri-linkedin-box-line"></i>
						</a>
						<a href="" target="_blank" class="social-home-link">
							<i class="ri-instagram-line"></i>
						</a>
						<a href="" target="_blank" class="social-home-link">
							<i class="ri-github-fill"></i>
						</a>
						<a href="" target="_blank" class="social-home-link">
							<i class="ri-facebook-box-line"></i>
						</a>
					</div>

					<a
						href="assets/pdf/Anid-Cv.pdf"
						target="_blank"
						download
						class="home-cv"
						>RESUME <i class="ri-file-list-2-line"></i
					></a>
				</div>
			</section>

			<!--==================== ABOUT ====================-->
			<section class="about section" id="about"></section>

			<!--==================== PROJECTS ====================-->
			<section class="projects section" id="projects"></section>

			<!--==================== WORK ====================-->
			<section class="work section"></section>

			<!--==================== SERVICES ====================-->
			<section class="services section"></section>

			<!--==================== TESTIMONIALS ====================-->
			<section class="testimonials section"></section>

			<!--==================== CONTACT ====================-->
			<section class="contact section" id="contact"></section>

		<!--==================== FOOTER ====================-->
		<footer class="footer grid"></footer>

		<!--=============== SCROLLREVEAL ===============-->
		<script src="assets/js/scrollreveal.min.js"></script>

		<!--=============== ANIME JS ===============-->
		<script src="https://cdn.jsdelivr.net/npm/animejs/lib/anime.iife.min.js"></script>

		<!--=============== SWIPER JS ===============-->
		<script src="assets/js/swiper-bundle.min.js"></script>

		<!--=============== MAIN JS ===============-->
		<script src="assets/js/main.js"></script>
